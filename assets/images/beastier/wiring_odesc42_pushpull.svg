<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Segoe UI, Arial, sans-serif" font-size="16">
  <rect width="900" height="360" fill="#ffffff"/>
  <rect x="40" y="70" width="230" height="240" rx="14" fill="#f3f4f6" stroke="#333" stroke-width="2"/>
  <text x="155" y="100" text-anchor="middle" font-weight="bold">Shaft encoder</text>
  <text x="155" y="122" text-anchor="middle" font-size="13">38 mm, 6 mm shaft, 2500 PPR</text>
  <text x="155" y="140" text-anchor="middle" font-size="13">push-pull output, 5-26 V supply</text>
  <rect x="630" y="70" width="230" height="240" rx="14" fill="#e8f0fe" stroke="#333" stroke-width="2"/>
  <text x="745" y="100" text-anchor="middle" font-weight="bold">ODESC V4.2</text>
  <text x="745" y="122" text-anchor="middle" font-size="13">encoder header (GH1.25, 5 pin)</text>
  <g stroke-width="4" fill="none">
    <line x1="270" y1="170" x2="630" y2="170" stroke="#d00000"/>
    <line x1="270" y1="200" x2="630" y2="200" stroke="#111111"/>
    <line x1="270" y1="230" x2="630" y2="230" stroke="#1a9c3a"/>
    <line x1="270" y1="260" x2="630" y2="260" stroke="#9a9a9a"/>
    <line x1="270" y1="290" x2="400" y2="290" stroke="#e0b000" stroke-dasharray="10 8"/>
  </g>
  <g font-size="14" text-anchor="end">
    <text x="262" y="165">VCC (red)</text>
    <text x="262" y="195">0V (black)</text>
    <text x="262" y="225">A (green)</text>
    <text x="262" y="255">B (white)</text>
    <text x="262" y="285">Z (yellow)</text>
  </g>
  <g font-size="14" font-weight="bold">
    <text x="640" y="165">5V</text>
    <text x="640" y="195">GND</text>
    <text x="640" y="225">A</text>
    <text x="640" y="255">B</text>
    <text x="640" y="285">Z  (not used)</text>
  </g>
  <text x="410" y="295" font-size="13" fill="#555">Z is optional. Firmware does not need it.</text>
  <text x="450" y="40" text-anchor="middle" font-size="14" fill="#b00000" font-weight="bold">Power the encoder from the ODESC 5V pin only. Never from the PSU rail.</text>
  <text x="450" y="340" text-anchor="middle" font-size="13" fill="#555">Match by printed signal name, not by color. Shield, if any, to GND at the ODESC end only.</text>
</svg>
