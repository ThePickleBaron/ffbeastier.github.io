title: FFBeastier
description: FFBeast documentation, plus the Beastier ODESC V4.2 wheel build
theme: just-the-docs

url: https://thepicklebaron.github.io
baseurl: ""  # set by the Pages workflow at build time

aux_links:
  Upstream FFBeast docs: https://ffbeast.github.io
  Discord channel: https://discord.gg/5ZKD46zQSU

color_scheme: custom
logo: /assets/images/logo.png

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

callouts:
  warning:
    color: red
  highlight:
    color: grey-dk
  note:
    color: green
  important:
    color: blue

plugins:
  - jekyll-redirect-from

exclude:
  - tools/
  - README.md
  - Gemfile
  - Gemfile.lock
