[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beastier-effects"
version = "0.1.0"
description = "Telemetry-driven extra force feedback effects for the FFBeast DIY wheel"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
hid = ["hidapi>=0.14"]
dev = ["pytest>=8"]

[project.scripts]
beastier-effects = "beastier_effects.cli:main"

[tool.setuptools.packages.find]
include = ["beastier_effects*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
